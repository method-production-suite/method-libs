[package]
name = "method-update"
description = "The Method Production Suite's updater: latest.json, minisign, the Mac bundle swap, the restart and the check schedule"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The same comparison the latest.json format's own updater makes (`semver::Version`).
semver.workspace = true
# Verifies the minisign signature of every download. Pure Rust, no C.
minisign-verify.workspace = true
base64.workspace = true
# HTTPS with rustls and the webpki roots (ureq's defaults). Redirects are
# followed by hand so every hop meets the host rule (src/transport.rs).
ureq.workspace = true
# The .app.tar.gz the release pipelines publish.
flate2.workspace = true
tar.workspace = true
# CFBundleExecutable, read from the bundle's own Info.plist (XML or binary).
plist.workspace = true

[dev-dependencies]
# Signs test updates the way the release pipelines do; never linked into an app.
minisign.workspace = true
tempfile.workspace = true
