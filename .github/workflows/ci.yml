# Least privilege by default. Every action pinned to a full commit SHA, the same pins
# as the other Method repos (SUITE-STANDARDS.md: checkout v7.0.1).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    # Drafts build nothing; marking a PR ready starts CI (SUITE-STANDARDS §6).
    types: [opened, synchronize, reopened, ready_for_review]
  # nightly.yml calls this with full: true for macOS and Windows (Lean CI, §6).
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    # fmt, clippy and tests. Pull requests and pushes to main run Linux only; the
    # nightly (full: true) adds macOS and Windows (Lean CI, SUITE-STANDARDS §6). The
    # Rust steps run whenever crates/*/Cargo.toml exists (crates/method-update does).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest","macos-15","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Any crates yet?
        id: crates
        shell: bash
        run: |
          if compgen -G "crates/*/Cargo.toml" > /dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; echo "No crates yet: nothing to build."; fi
      - name: Format
        if: steps.crates.outputs.any == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.crates.outputs.any == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: steps.crates.outputs.any == 'true'
        run: cargo test --workspace --locked
  cooldown:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Fails a change that adds crates published less than 14 days ago (Method Budget's
    # check, scripts/check-crate-ages.py).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base=origin/main
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            python3 scripts/check-crate-ages.py --lock Cargo.lock --only-changed "$base"
          else
            python3 scripts/check-crate-ages.py --lock Cargo.lock
          fi
  deny:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # deny.toml: known advisories, licenses compatible with MIT OR Apache-2.0,
    # crates.io as the only source. Skipped only when there are no crates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Any crates yet?
        id: crates
        run: |
          if compgen -G "crates/*/Cargo.toml" > /dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
      - name: Temporary advisory ignores not expired
        # deny.toml's `# ignore-expires:` date; fails once it has passed while
        # the ignores it covers are still listed.
        run: python3 scripts/check-ignore-expiry.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        if: steps.crates.outputs.any == 'true'
        with:
          command: check
