# The full build on macOS, Windows and Linux, once a night on main (Lean CI,
# SUITE-STANDARDS §6). A scheduled run skips itself when main hasn't moved since the
# last green nightly; a manual run (Actions > nightly > Run workflow) always builds,
# which is the check before tagging.
name: nightly
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/$REPO/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "main is still $SHA, the last green nightly: nothing to build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  full:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      full: true
