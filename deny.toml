# cargo deny check: known advisories, licenses and crate sources (the `deny`
# job in .github/workflows/ci.yml runs it on every push). Copied from Method Budget's.

[advisories]
# Every advisory fails, unmaintained and unsound ones included, unless it is
# listed here with the reason it does not apply.
#
# The four below are fixed in rustls 0.23.46, published 2026-10-14: too new for
# the 14-day cooldown (scripts/check-crate-ages.py) until 2026-10-28. Until then
# the lock keeps 0.23.45; on or after that date, `cargo update -p rustls
# --precise 0.23.46` and delete these four lines. None of them reaches the
# updater, which is ureq with rustls on the ring provider and nothing else:
ignore = [
    # Debug impls of client session values: nothing here formats them.
    { id = "RUSTSEC-2026-0346", reason = "no Debug formatting of rustls session values; bump to 0.23.46 on 2026-10-28" },
    # ECH rejection: ureq never turns Encrypted Client Hello on.
    { id = "RUSTSEC-2026-0347", reason = "ECH is not enabled by ureq; bump to 0.23.46 on 2026-10-28" },
    # Brotli certificate decompression: the brotli feature is off.
    { id = "RUSTSEC-2026-0348", reason = "rustls brotli feature not enabled; bump to 0.23.46 on 2026-10-28" },
    # Post-quantum downgrade: the ring provider offers classical groups only.
    { id = "RUSTSEC-2026-0349", reason = "ring provider has no post-quantum groups to downgrade from; bump to 0.23.46 on 2026-10-28" },
]

[licenses]
# Everything we ship must be compatible with distributing the suite libraries under
# MIT OR Apache-2.0. This is the list the dependency tree actually needs; a new
# license fails CI until someone has looked at it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-root-certs: the Mozilla root certificate list as data.
    "CDLA-Permissive-2.0",
    # File-level copyleft, unmodified (cssparser, selectors, dtoa-short via
    # Tauri; option-ext via dirs). Fine to ship alongside MIT/Apache code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common under Tauri; worth seeing, not worth failing.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
