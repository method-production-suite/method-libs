# cargo deny check: known advisories, licenses and crate sources (the `deny`
# job in .github/workflows/ci.yml runs it on every push). Copied from Method Budget's.

[advisories]
# Every advisory fails, unmaintained and unsound ones included, unless it is
# listed here with the reason it does not apply.
ignore = []

[licenses]
# Everything we ship must be compatible with distributing the suite libraries under
# MIT OR Apache-2.0. This is the list the dependency tree actually needs; a new
# license fails CI until someone has looked at it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-root-certs: the Mozilla root certificate list as data.
    "CDLA-Permissive-2.0",
    # File-level copyleft, unmodified (cssparser, selectors, dtoa-short via
    # Tauri; option-ext via dirs). Fine to ship alongside MIT/Apache code.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common under Tauri; worth seeing, not worth failing.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
